<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#534AB7">
  <title>萌账</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-title">🐾 萌账 <span class="ver">v2</span></div>
      <div class="header-sub">记下来，月底看得懂</div>
    </header>

    <main id="view"></main>

    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-tab="record">✏️<span>记一笔</span></button>
      <button class="tab" data-tab="list">📋<span>流水</span></button>
      <button class="tab" data-tab="stats">📊<span>统计</span></button>
      <button class="tab" data-tab="settings">⚙️<span>设置</span></button>
    </nav>
  </div>

  <div class="modal-mask" id="modal" hidden>
    <div class="modal" id="modal-body"></div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
